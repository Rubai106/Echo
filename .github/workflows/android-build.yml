name: Android build and tests

on:
  push:
    branches:
      - main
      - fix/media-playback
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and package debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu images already include the Android command-line
      # tools. Avoid android-actions/setup-android here: its current setup path
      # attempts to install the removed legacy "tools" SDK package.
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          test -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" || find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build and run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
